# Hyperparameter search over retrieval methods, estimators and predictors.
# The [run_parameters], [join_parameters], [evaluation_models] and
# [estimators] sections have the same meaning as in the evaluation configs;
# the [search] section configures the search itself.
["run_parameters"]
task = "regression"
n_splits = [10]
test_size = 0.2
split_kind = "group_shuffle"

["join_parameters"]
join_strategy = "left"
aggregation = ["first"]

["evaluation_models"]
chosen_model = ["ridgecv", "catboost", "realmlp", "resnet"]
catboost.iterations = 300
catboost.od_type = "Iter"
catboost.od_wait = 10
catboost.l2_leaf_reg = 0.01
catboost.thread_count = 2

["estimators"]
no_join.active = true
full_join.active = true
best_single_join.active = true
highest_containment.active = true
stepwise_greedy_join.active = true
stepwise_greedy_join.budget_type = "iterations"
stepwise_greedy_join.budget_amount = [30]
stepwise_greedy_join.epsilon = [0.0]
stepwise_greedy_join.ranking_metric = "containment"

["query_cases"]
data_lake = ["binary_update"]
join_discovery_method = ["exact_matching", "minhash", "minhash_hybrid"]
table_path = [
    "data/source_tables/yadl/us_elections-yadl-depleted.parquet",
]
query_column = "col_to_embed"

# The query results of every retrieval method must exist before running the
# search (see query_indices.py).

["search"]
# Randomized search configuration.
n_iter = [60]
backend = ["optuna"]
# Optional seed: fixes both the CV folds and the sampler.
seed = [0]
# Optional resumable study (uncomment to persist the Optuna study):
# storage = ["sqlite:///results/studies/search-binary.db"]
# study_name = ["search-binary"]
# Search-space axes (optional; defaults below).
aggregation_choices = ["first", "mean"]
top_k_choices = [10, 30, 100]
# cache_dir = ["results/skrub_cache"]
# n_jobs = [-1]
